experiment:
  max_debate_rounds: 6
  disagreement_threshold: 0.5
  convergence_threshold: 0.9
  seed: 42

datasets:
  gsm8k:
    split: test
    num_samples: 100
    path: data/gsm8k
  strategyqa:
    split: test
    num_samples: 100
    path: data/strategyqa
  mmlu:
    split: test
    num_samples: 100
    path: data/mmlu

metrics:
  - answer_entropy
  - confidence_variance
  - disagreement_persistence
  - answer_flip_rate

logging:
  level: INFO
  log_dir: results/logs
  results_dir: results/tables
  plots_dir: results/plots